name: deploy
on:
  push:
    tags: ['v*']

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/deploy.sh staging

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production   # reviewers are set in repository settings, not here
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/deploy.sh production
