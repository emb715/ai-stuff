# .github/workflows/bot-review.yml — the reusable workflow ci.yml calls
name: bot-review
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
  # One job per review round. Add yours here: a Claude review job,
  # a stack-specific check. Each stops the pipeline when it fails.
