name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: Breaking changes
    semver-increment: major
    exclusive: true
    when:
      conventional:
        breaking: true
  - title: Features
    semver-increment: minor
    when:
      conventional:
        type: feat
  - title: Fixes
    when:
      conventional:
        type: fix
  - title: Maintenance
    when:
      conventional:
        types: [chore, refactor, docs]
  - type: version-resolver
    semver-increment: patch
