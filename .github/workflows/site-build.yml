name: Site Build

on:
  pull_request:

jobs:
  site-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: _meta/site
        run: npm ci

      - name: Build
        working-directory: _meta/site
        run: npm run build
