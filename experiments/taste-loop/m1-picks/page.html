<title>Taste Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky decision bar over two scrollable screenshots, side by side on desktop, stacked on phones. */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #1d2024; --muted: #5d636b; --line: #dcdcd6;
  --accent: #2c4a8a; --accent-ink: #ffffff; --chosen: #e7ecf6; --warn: #8a5a00;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --surface: #1d2024; --ink: #ecedee; --muted: #a2a8b0; --line: #33373d;
  --accent: #8fa9e6; --accent-ink: #10131a; --chosen: #232c3e; --warn: #e0b45c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --ink: #ecedee; --muted: #a2a8b0; --line: #33373d;
  --accent: #8fa9e6; --accent-ink: #10131a; --chosen: #232c3e; --warn: #e0b45c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: var(--s3); display: grid; gap: var(--s3); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s2) var(--s4); }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: flex; gap: var(--s3); flex-wrap: wrap; }
.brief { margin: 0; color: var(--muted); max-width: 70ch; }
.brief b { color: var(--ink); font-weight: 600; }
.note { font-size: 13px; color: var(--warn); margin: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.side { min-width: 0; display: grid; gap: var(--s2); }
.side h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.frame { height: max(360px, calc(100vh - 330px)); overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.frame.chosen { outline: 2px solid var(--accent); outline-offset: 2px; }
.frame img { display: block; width: 100%; height: auto; }
.bar { position: sticky; bottom: 0; background: var(--bg); padding-block: var(--s2) calc(var(--s2) + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: var(--s2); }
.choices { display: grid; grid-template-columns: 1fr auto auto 1fr; gap: var(--s2); }
button { font: 500 14px/1 var(--f-ui); min-height: 44px; padding: 0 var(--s3); border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.pick { font-weight: 600; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
kbd { font-family: var(--f-mono); font-size: 11px; color: inherit; opacity: .7; margin-left: 6px; }
.row { display: flex; gap: var(--s2); align-items: center; }
.row input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: 14px var(--f-ui); }
.row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.status { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-height: 18px; }
@media (max-width: 720px) {
  .pair { grid-template-columns: 1fr; }
  .frame { height: 60vh; }
  .choices { grid-template-columns: 1fr 1fr; }
  .row { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: no-preference) { button { transition: background .15s ease-out, border-color .15s ease-out; } }
</style>

<div class="wrap">
  <header>
    <h1>Taste Picks</h1>
    <div class="meta"><span id="pos">Pair 1 of 30</span><span id="done">0 picked</span></div>
  </header>
  <p class="brief" id="brief"></p>
  <p class="note" id="note" hidden>Picks can't be saved in this view. Open the page signed in to claude.ai to record them.</p>

  <section class="pair" aria-label="Two pages to compare">
    <div class="side"><h2><span>A</span><span id="a-id"></span></h2><div class="frame" id="a-frame"><img id="a-img" alt="Page A, full-page screenshot"></div></div>
    <div class="side"><h2><span>B</span><span id="b-id"></span></h2><div class="frame" id="b-frame"><img id="b-img" alt="Page B, full-page screenshot"></div></div>
  </section>

  <div class="bar">
    <div class="choices" role="group" aria-label="Which page is better">
      <button class="pick" id="c-left" data-choice="left">A is better<kbd>A</kbd></button>
      <button id="c-tie" data-choice="tie">Tie<kbd>T</kbd></button>
      <button id="c-neither" data-choice="neither">Neither works<kbd>N</kbd></button>
      <button class="pick" id="c-right" data-choice="right">B is better<kbd>B</kbd></button>
    </div>
    <div class="row">
      <label for="reason">Why (optional)</label>
      <input id="reason" maxlength="200" placeholder="One line, e.g. calmer hierarchy, hero feels generic" autocomplete="off">
      <button id="prev" aria-label="Previous pair">←</button>
      <button id="next" aria-label="Next pair">→</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

<script>
const BRIEFS = {
  t1: '<b>Landing page with pricing</b> for a note-taking app for writers. It should feel calm and premium.',
  t3: '<b>Operations dashboard</b> for a small logistics team: 4 KPIs, a shipments table, and a filter bar.'
};
// Blind pairs: page ids only; which condition built each page is kept outside this page.
const PAIRS = [["q01","t3","p12","p05"],["q02","t1","p11","p10"],["q03","t3","p08","p03"],["q04","t1","p02","p10"],["q05","t3","p04","p08"],["q06","t1","p09","p10"],["q07","t1","p07","p10"],["q08","t1","p07","p09"],["q09","t3","p01","p03"],["q10","t3","p01","p04"],["q11","t1","p02","p09"],["q12","t1","p06","p09"],["q13","t1","p10","p06"],["q14","t1","p11","p02"],["q15","t3","p01","p05"],["q16","t3","p01","p08"],["q17","t1","p11","p06"],["q18","t1","p11","p07"],["q19","t3","p04","p03"],["q20","t3","p05","p03"],["q21","t1","p02","p06"],["q22","t1","p09","p11"],["q23","t3","p08","p12"],["q24","t3","p03","p12"],["q25","t3","p01","p12"],["q26","t3","p05","p08"],["q27","t3","p04","p05"],["q28","t1","p07","p06"],["q29","t3","p04","p12"],["q30","t1","p07","p02"]]
  .map(([id, task, left, right]) => ({ id, task, left, right }));

const $ = id => document.getElementById(id);
const picks = {};          // pair id -> {choice, reason}
let i = 0, db = null, started = false;

function render() {
  const p = PAIRS[i], mine = picks[p.id] || {};
  $('brief').innerHTML = BRIEFS[p.task];
  $('pos').textContent = `Pair ${i + 1} of ${PAIRS.length}`;
  $('done').textContent = `${Object.keys(picks).length} picked`;
  $('a-id').textContent = p.left; $('b-id').textContent = p.right;
  if ($('a-img').dataset.src !== p.left) { $('a-img').src = `img/${p.left}.jpg`; $('a-img').dataset.src = p.left; $('a-frame').scrollTop = 0; }
  if ($('b-img').dataset.src !== p.right) { $('b-img').src = `img/${p.right}.jpg`; $('b-img').dataset.src = p.right; $('b-frame').scrollTop = 0; }
  for (const b of document.querySelectorAll('[data-choice]')) b.setAttribute('aria-pressed', String(mine.choice === b.dataset.choice));
  $('a-frame').classList.toggle('chosen', mine.choice === 'left');
  $('b-frame').classList.toggle('chosen', mine.choice === 'right');
  if (document.activeElement !== $('reason')) $('reason').value = mine.reason || '';
  $('prev').disabled = i === 0; $('next').disabled = i === PAIRS.length - 1;
  // preload the next pair
  const n = PAIRS[i + 1]; if (n) { new Image().src = `img/${n.left}.jpg`; new Image().src = `img/${n.right}.jpg`; }
}

async function save(p) {
  const v = picks[p.id];
  if (!db) { $('status').textContent = 'Not saved: this view has no storage.'; return; }
  try {
    await db.collection('picks').doc(p.id).set({
      pair: p.id, task: p.task, left: p.left, right: p.right, choice: v.choice,
      winner: v.choice === 'left' ? p.left : v.choice === 'right' ? p.right : null,
      reason: v.reason || '', at: Date.now()
    });
    $('status').textContent = `Saved ${p.id}.`;
  } catch (e) { $('status').textContent = `Couldn't save ${p.id}: ${e.code || e.message}. Pick again to retry.`; }
}

function choose(choice) {
  const p = PAIRS[i];
  picks[p.id] = { choice, reason: $('reason').value.trim() };
  save(p);
  const nextOpen = PAIRS.findIndex((q, k) => k > i && !picks[q.id]);
  if (nextOpen > -1) { i = nextOpen; $('reason').value = ''; }
  else if (Object.keys(picks).length === PAIRS.length) $('status').textContent = 'All 30 pairs picked. Thank you.';
  render();
}

for (const b of document.querySelectorAll('[data-choice]')) b.addEventListener('click', () => choose(b.dataset.choice));
$('prev').addEventListener('click', () => { if (i > 0) { i--; render(); } });
$('next').addEventListener('click', () => { if (i < PAIRS.length - 1) { i++; render(); } });
$('reason').addEventListener('change', () => {
  const p = PAIRS[i]; if (!picks[p.id]) return;
  picks[p.id].reason = $('reason').value.trim(); save(p);
});
document.addEventListener('keydown', e => {
  if (e.target === $('reason') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'a') choose('left'); else if (k === 'b') choose('right');
  else if (k === 't') choose('tie'); else if (k === 'n') choose('neither');
  else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === 'ArrowRight') $('next').click();
});

render();

(async () => {
  const timer = setTimeout(() => { if (!db) $('note').hidden = false; }, 10000);
  db = window.claude ? await window.claude.use('db') : null;
  clearTimeout(timer);
  if (!db) { $('note').hidden = false; return; }
  db.collection('picks').onSnapshot(snap => {
    for (const d of snap.docs) { const v = d.data(); picks[d.id] = { choice: v.choice, reason: v.reason }; }
    if (!started) { started = true; const first = PAIRS.findIndex(q => !picks[q.id]); i = first > -1 ? first : 0; }
    render();
  }, () => { $('status').textContent = "Couldn't load earlier picks."; });
})();
</script>
